<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>THE BOARD WITHOUT A VICTOR v0.1</title>
<style>
:root{--panel:#15202b;--panel2:#263643;--gold:#e9c66a;--ink:#f5f2e8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans",sans-serif}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:#2f5966;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;transform-origin:center;transition:transform .12s ease-out}
.ocean{fill:#315e6b}
.land{fill:#b8aa8d;stroke:#716c5d;stroke-width:1.2}
.country{stroke:#6b6659;stroke-width:1.5;opacity:.92}
.country-a{fill:#b8a7a0}.country-b{fill:#c4b89a}.country-c{fill:#9cae91}.country-d{fill:#c5a5a0}.country-e{fill:#a8b4b8}
.gridline{stroke:#d8d4c3;stroke-width:.45;opacity:.18;fill:none}
.coastlabel{font-size:12px;letter-spacing:4px;fill:#9bb5b7;opacity:.55}
.city{cursor:pointer;user-select:none}
.city circle{fill:#f4e7c9;stroke:#463e31;stroke-width:1.3}
.city text{font-size:12px;font-weight:650;fill:#fff;paint-order:stroke;stroke:#26313a;stroke-width:3px;stroke-linejoin:round}
.city.selected circle{fill:#ffd45e;stroke:#fff;stroke-width:3}
.unit{cursor:pointer;filter:drop-shadow(0 1px 1px #17212a)}
.unit rect{stroke:#eee4cf;stroke-width:1}
.unit text{font-size:10px;font-weight:900;fill:#fff;text-anchor:middle;dominant-baseline:central}
.unit.infantry rect{fill:#3d795b}.unit.tank rect{fill:#6b5744}.unit.air rect{fill:#466c91}
.unit.selected rect{stroke:#ffe16b;stroke-width:3}
.marker{font-size:16px;paint-order:stroke;stroke:#222;stroke-width:2px;cursor:pointer}
.hud{position:absolute;z-index:5;background:linear-gradient(#18242eeF,#111b24F2);border:1px solid #52616b;border-radius:10px;box-shadow:0 3px 12px #0005}
.topbar{top:10px;left:10px;right:10px;display:flex;align-items:center;gap:8px;padding:7px 10px;min-height:44px}
.resource{font-size:12px;font-weight:750;white-space:nowrap}.resource b{color:var(--gold);font-size:14px;margin-left:4px}
.date{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.speed{border:1px solid #65717a;border-radius:7px;background:#334450;color:white;padding:5px 8px;font-weight:800}
.leftbar{left:10px;top:68px;display:flex;flex-direction:column;gap:6px;padding:6px}
.tool{width:38px;height:38px;border:1px solid #5b6a73;border-radius:8px;background:#2a3944;color:#fff;font-size:18px;display:grid;place-items:center}
.bottom{left:10px;right:10px;bottom:10px;padding:9px 10px;display:flex;gap:8px;align-items:center}
.flag{width:30px;height:22px;border:1px solid #d4d0c4;border-radius:3px;background:linear-gradient(#fff 0 33%,#d84a43 33% 66%,#fff 66%);display:grid;place-items:center;color:#24518b;font-size:11px;font-weight:900}
.info{min-width:0;flex:1}.info strong{display:block;font-size:13px}.info small{display:block;color:#bdc7cb;font-size:10px;margin-top:2px}
.action{border:1px solid #7b8b93;border-radius:8px;background:#3b4e5b;color:white;padding:8px 10px;font-size:11px;font-weight:750;white-space:nowrap}
.toast{position:absolute;z-index:8;top:62px;left:50%;transform:translateX(-50%);background:#17242ddd;border:1px solid #71808a;border-radius:9px;padding:8px 12px;font-size:12px;display:none;max-width:90%;text-align:center}
.zoom{position:absolute;right:10px;bottom:94px;display:flex;flex-direction:column;gap:5px;z-index:5}
.zoom button{width:34px;height:34px;border:1px solid #63717a;border-radius:8px;background:#1c2b35eF;color:white;font-size:20px}
.brand{position:absolute;z-index:4;top:61px;left:50%;transform:translateX(-50%);background:#17242dcc;border:1px solid #53636c;border-radius:8px;padding:5px 10px;text-align:center;white-space:nowrap;pointer-events:none}.brand strong{display:block;font-size:12px;letter-spacing:.06em}.brand small{display:block;font-size:8px;color:#c4ced2;letter-spacing:.08em}.legend{position:absolute;right:10px;top:68px;background:#17242dcc;border:1px solid #53636c;border-radius:8px;padding:7px 9px;font-size:10px;z-index:4}
@media(min-width:760px){.topbar{left:18px;right:18px;top:16px;padding:10px 16px}.resource{font-size:14px}.leftbar{left:18px;top:82px}.bottom{left:18px;right:18px;bottom:18px}.legend{top:82px;right:18px}.zoom{right:18px;bottom:120px}}
</style>
</head>
<body>
<div id="game" aria-label="THE BOARD WITHOUT A VICTOR v0.1 prototype">
<svg id="map" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-label="World map">
<rect class="ocean" width="1200" height="700"/>
<g class="gridline">
<path d="M0 140H1200M0 280H1200M0 420H1200M0 560H1200"/>
<path d="M200 0V700M400 0V700M600 0V700M800 0V700M1000 0V700"/>
<ellipse cx="600" cy="350" rx="460" ry="300"/>
</g>
<!-- stylized world land silhouettes -->
<g class="land">
<path d="M65 120L110 70 190 50 240 85 275 115 310 105 335 145 310 185 280 205 265 250 230 275 215 330 180 350 150 315 130 270 95 240 70 190Z"/>
<path d="M250 350L295 365 330 405 345 465 325 530 300 590 270 625 250 570 235 510 220 450Z"/>
<path d="M370 120L420 90 465 105 500 80 555 95 600 80 645 100 690 90 735 115 780 100 820 130 865 120 900 150 940 135 990 160 1030 150 1080 190 1120 230 1100 270 1060 275 1030 310 990 300 970 340 925 350 890 325 850 350 810 330 770 350 735 320 700 330 670 300 630 310 600 285 560 300 530 270 495 285 460 260 430 230 390 220 365 180Z"/>
<path d="M510 300L560 290 610 315 640 360 625 420 595 480 560 525 535 495 520 445 490 400 480 350Z"/>
<path d="M770 360L820 345 865 365 900 405 925 450 900 500 870 535 830 515 805 465 780 420Z"/>
<path d="M930 400L970 380 1015 395 1050 430 1080 470 1055 505 1010 500 975 475 950 440Z"/>
<path d="M1040 540L1080 530 1110 555 1095 580 1060 575Z"/>
<path d="M650 170L680 155 710 170 705 205 675 215 650 195Z"/>
<path d="M350 205L370 190 385 205 380 230 360 235Z"/>
</g>
<!-- country blocks -->
<g>
<path class="country country-a" d="M395 140L460 110 505 125 520 180 490 220 435 210 390 185Z"/>
<path class="country country-b" d="M520 125L610 105 660 135 650 205 600 230 535 200Z"/>
<path class="country country-c" d="M660 135L745 125 795 165 775 220 710 230 650 205Z"/>
<path class="country country-d" d="M435 210L490 220 535 200 570 245 550 295 500 300 455 270Z"/>
<path class="country country-e" d="M570 245L650 205 710 230 700 290 650 320 600 300 550 295Z"/>
<path class="country country-b" d="M710 230L775 220 820 260 800 315 735 320 700 290Z"/>
<path class="country country-c" d="M280 390L315 410 330 470 310 520 285 500 265 440Z"/>
<path class="country country-a" d="M805 370L855 365 895 410 880 460 840 470 810 430Z"/>
<path class="country country-d" d="M1000 400L1045 415 1070 455 1040 480 1005 465 985 435Z"/>
</g>
<text class="coastlabel" x="150" y="405" transform="rotate(-18 150 405)">ATLANTIC OCEAN</text>
<text class="coastlabel" x="745" y="570">INDIAN OCEAN</text>
<!-- cities -->
<g id="cities">
<g class="city" data-city="Ottawa" transform="translate(245 225)"><circle r="5"/><text x="9" y="4">Ottawa</text></g>
<g class="city" data-city="Washington" transform="translate(260 295)"><circle r="5"/><text x="9" y="4">Washington</text></g>
<g class="city" data-city="London" transform="translate(500 205)"><circle r="5"/><text x="-4" y="-12">London</text></g>
<g class="city" data-city="Paris" transform="translate(525 235)"><circle r="5"/><text x="-3" y="19">Paris</text></g>
<g class="city" data-city="Berlin" transform="translate(565 210)"><circle r="5"/><text x="9" y="4">Berlin</text></g>
<g class="city" data-city="Rome" transform="translate(555 270)"><circle r="5"/><text x="9" y="4">Rome</text></g>
<g class="city" data-city="Moscow" transform="translate(700 185)"><circle r="5"/><text x="9" y="4">Moscow</text></g>
<g class="city" data-city="Cairo" transform="translate(635 345)"><circle r="5"/><text x="9" y="4">Cairo</text></g>
<g class="city" data-city="Delhi" transform="translate(755 350)"><circle r="5"/><text x="9" y="4">Delhi</text></g>
<g class="city" data-city="Tokyo" transform="translate(1035 270)"><circle r="5"/><text x="9" y="4">Tokyo</text></g>
<g class="city" data-city="Beijing" transform="translate(935 255)"><circle r="5"/><text x="9" y="4">Beijing</text></g>
<g class="city" data-city="Canberra" transform="translate(1040 520)"><circle r="5"/><text x="9" y="4">Canberra</text></g>
</g>
<!-- units -->
<g id="units">
<g class="unit infantry" data-unit="1" transform="translate(475 218)"><rect x="-10" y="-10" width="20" height="20" rx="5"/><text y="1">I</text></g>
<g class="unit tank" data-unit="2" transform="translate(550 220)"><rect x="-10" y="-10" width="20" height="20" rx="5"/><text y="1">T</text></g>
<g class="unit infantry" data-unit="3" transform="translate(580 245)"><rect x="-10" y="-10" width="20" height="20" rx="5"/><text y="1">I</text></g>
<g class="unit air" data-unit="4" transform="translate(690 190)"><rect x="-10" y="-10" width="20" height="20" rx="5"/><text y="1">A</text></g>
<g class="unit tank" data-unit="5" transform="translate(990 270)"><rect x="-10" y="-10" width="20" height="20" rx="5"/><text y="1">T</text></g>
</g>
<!-- battle markers -->
<text class="marker" x="532" y="255">⚔️</text><text class="marker" x="710" y="225">💥</text><text class="marker" x="970" y="300">⚔️</text>
</svg>
<div class="hud topbar">
<span class="resource">💰<b id="money">200</b></span><span class="resource">⚙️<b id="industry">40</b></span><span class="resource">✦<b id="politics">8</b></span>
<span class="date" id="date">1936.01.01</span><button class="speed" id="speed">▶ ×1</button>
</div>
<div class="hud leftbar">
<button class="tool" title="Politics" data-action="Politics">♟</button>
<button class="tool" title="Research" data-action="Research">🔬</button>
<button class="tool" title="Construction" data-action="Construction">🏗</button>
<button class="tool" title="Diplomacy" data-action="Diplomacy">🤝</button>
<button class="tool" title="Military" data-action="Military">⚔</button>
</div>
<div class="brand"><strong>THE BOARD WITHOUT A VICTOR</strong><small>World Strategy Prototype v0.1</small></div>
<div class="legend">🟩 Infantry　🟫 Armor　🟦 Air<br>⚔️ In combat</div>
<div class="zoom"><button id="plus">+</button><button id="minus">−</button><button id="reset">⌂</button></div>
<div class="hud bottom">
<div class="flag" id="flag">★</div>
<div class="info"><strong id="selectedTitle">Japan — National Overview</strong><small id="selectedInfo">Capital: Tokyo　Factories: 12　Divisions: 8</small></div>
<button class="action" id="order">Order</button>
<button class="action" id="details">Details</button>
</div>
<div class="toast" id="toast"></div>
</div>
<script>
const map=document.getElementById('map'),game=document.getElementById('game');
let zoom=1,day=1,month=1,year=1936,running=false,interval=null,selected='Japan',selectedUnit=null;
const cities={Ottawa:['Canada','Capital'],Washington:['United States','Capital'],London:['United Kingdom','Capital'],Paris:['France','Capital'],Berlin:['Germany','Capital'],Rome:['Italy','Capital'],Moscow:['Soviet Union','Capital'],Cairo:['Egypt','City'],Delhi:['India','City'],Tokyo:['Japan','Capital'],Beijing:['China','Capital'],Canberra:['Australia','Capital']};
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',1900)}
function setZoom(v){zoom=Math.max(.75,Math.min(2.2,v));map.style.transform=`scale(${zoom})`}
document.getElementById('plus').onclick=()=>setZoom(zoom+.15);
document.getElementById('minus').onclick=()=>setZoom(zoom-.15);
document.getElementById('reset').onclick=()=>setZoom(1);
document.querySelectorAll('.city').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();document.querySelectorAll('.city').forEach(c=>c.classList.remove('selected'));el.classList.add('selected');const name=el.dataset.city;selected=cities[name][0];document.getElementById('selectedTitle').textContent=name+' — '+cities[name][0];document.getElementById('selectedInfo').textContent=cities[name][1]+'　Factories: '+(name==='Tokyo'?12:Math.floor(Math.random()*9+3))+'　Units: '+Math.floor(Math.random()*8+2);document.getElementById('flag').textContent=name==='Tokyo'?'☀':'★';toast(name+' selected');}));
document.querySelectorAll('.unit').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();document.querySelectorAll('.unit').forEach(u=>u.classList.remove('selected'));el.classList.add('selected');selectedUnit=el.dataset.unit;toast('Unit '+selectedUnit+' selected');}));
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>toast(b.dataset.action+' screen will be implemented in a later build'));
document.getElementById('order').onclick=()=>toast(selectedUnit?'Movement order issued (prototype)':'Select a unit on the map first');
document.getElementById('details').onclick=()=>toast('National details for '+selected+' (prototype)');
document.getElementById('speed').onclick=()=>{running=!running;document.getElementById('speed').textContent=running?'Ⅱ ×2':'▶ ×1';if(interval)clearInterval(interval);if(running)interval=setInterval(()=>{day++;if(day>30){day=1;month++;if(month>12){month=1;year++}}document.getElementById('date').textContent=`${year}.${String(month).padStart(2,'0')}.${String(day).padStart(2,'0')}`;document.getElementById('money').textContent=200+Math.floor((day-1)*2);},900)};
let pointer=null,baseX=0,baseY=0,tx=0,ty=0;
game.addEventListener('pointerdown',e=>{if(e.target.closest('.hud,.zoom,.legend,.toast'))return;pointer=e.pointerId;baseX=e.clientX;});
game.addEventListener('pointerup',()=>pointer=null);
game.addEventListener('pointermove',e=>{if(pointer!==e.pointerId)return;const dx=e.clientX-baseX;baseX=e.clientX;tx+=dx;map.style.translate=`${tx}px ${ty}px`;});
</script>
</body>
</html>
